appId: com.spawncamp.app
productName: Spawncamp
directories:
  buildResources: build
# Allow-list, not exclusions: everything the app needs at runtime and nothing else.
# resources/ stays because the main process resolves tray.png there (?asset import).
files:
  - out/**
  - resources/**
  - package.json
# Docs shipped next to the app (outside the asar) so Settings can open them.
extraResources:
  - PRIVACY.md
  - THIRD-PARTY-NOTICES.md
  - LICENSE.md
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Spawncamp
  uninstallDisplayName: Spawncamp
  artifactName: ${productName}-${version}-setup.${ext}
